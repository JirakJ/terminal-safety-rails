<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <!-- Terminal background -->
  <rect x="4" y="6" width="32" height="28" rx="3" ry="3" fill="#37474F" stroke="#263238" stroke-width="1.5"/>
  <!-- Terminal title bar -->
  <rect x="4" y="6" width="32" height="6" rx="3" ry="3" fill="#546E7A"/>
  <circle cx="9" cy="9" r="1.5" fill="#EF5350"/>
  <circle cx="14" cy="9" r="1.5" fill="#FFC107"/>
  <circle cx="19" cy="9" r="1.5" fill="#66BB6A"/>
  <!-- Terminal prompt -->
  <text x="9" y="22" font-family="monospace" font-size="7" fill="#66BB6A">$</text>
  <text x="16" y="22" font-family="monospace" font-size="6" fill="#B0BEC5">rm -rf</text>
  <!-- Shield overlay -->
  <path d="M28 18 L36 22 L36 28 C36 31 33 34 28 36 C23 34 20 31 20 28 L20 22 Z"
        fill="#E53935" fill-opacity="0.9" stroke="#C62828" stroke-width="1"/>
  <!-- Stop hand icon in shield -->
  <line x1="25" y1="24" x2="31" y2="30" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="31" y1="24" x2="25" y2="30" stroke="white" stroke-width="2" stroke-linecap="round"/>
</svg>
